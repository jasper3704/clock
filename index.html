<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>純淨懸浮時鐘</title>
  <style>
    :root {
      --bg: #0c0d10;
      --card: #16181f;
      --text: #f4f4f6;
      --subtext: #8e93a4;
      --accent: #3b82f6;
      --danger: #ef4444;
      --warn-bg: rgba(245, 158, 11, 0.14);
      --warn-border: rgba(245, 158, 11, 0.4);
      --warn-text: #fcd34d;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: max(env(safe-area-inset-top), 28px) 16px max(env(safe-area-inset-bottom), 32px);
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 88%;
      max-width: 350px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      text-align: center;
      padding: 4px 0 2px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 4px 0;
      letter-spacing: -0.2px;
    }

    header p {
      font-size: 12.5px;
      color: var(--subtext);
      margin: 0;
    }

    .env-banner {
      display: none;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--warn-text);
      font-size: 13px;
      line-height: 1.5;
    }

    .env-banner strong {
      display: block;
      margin-bottom: 3px;
      font-size: 13.5px;
      color: #fde68a;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .preview-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 600 / 260;
      border-radius: 13px;
      overflow: hidden;
      background: #141418;
      border: 1px solid var(--border);
    }

    #pipVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #clockCanvas {
      display: none;
    }

    .btn-primary {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary.active {
      background: var(--danger);
    }

    .alert-box {
      display: none;
      padding: 11px 12px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      font-size: 12.5px;
      line-height: 1.5;
    }

    .section-label {
      font-size: 13px;
      color: var(--subtext);
      padding-left: 2px;
      margin-bottom: -4px;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .theme-btn {
      padding: 10px 10px;
      border-radius: 11px;
      border: 1.5px solid var(--border);
      background: #111318;
      color: var(--text);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .theme-btn.selected {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.14);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .tips {
      font-size: 12px;
      color: var(--subtext);
      line-height: 1.6;
      text-align: center;
      padding: 2px 6px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>純淨懸浮時鐘</h1>
      <p>無廣告、免安裝、跨 App 畫中畫懸浮</p>
    </header>

    <!-- 環境偵測提醒框 -->
    <div id="envBanner" class="env-banner"></div>

    <!-- 預覽與啟動區 -->
    <div class="card">
      <div class="preview-wrapper">
        <canvas id="clockCanvas" width="600" height="260"></canvas>
        <video id="pipVideo" playsinline muted autoplay></video>
      </div>

      <button id="toggleBtn" class="btn-primary">啟動懸浮時鐘</button>
      <div id="alertBox" class="alert-box"></div>
    </div>

    <!-- 配色主題 -->
    <div class="card">
      <div class="section-label">外觀配色</div>
      <div class="theme-grid" id="themeGrid">
        <button class="theme-btn selected" data-theme="pure">
          <span class="dot" style="background:#ffffff;"></span>黑底純白
        </button>
        <button class="theme-btn" data-theme="matrix">
          <span class="dot" style="background:#2ee872;"></span>黑底螢光綠
        </button>
        <button class="theme-btn" data-theme="amber">
          <span class="dot" style="background:#ffa61a;"></span>黑底琥珀橘
        </button>
        <button class="theme-btn" data-theme="light">
          <span class="dot" style="background:#18181b; border:1px solid #666;"></span>白底深黑
        </button>
      </div>
    </div>

    <div class="tips">
      啟動後直接上滑切至其他 App 即可保持懸浮<br>
      建議用 iPhone「捷徑」建立「打開 URL」置於桌面一鍵開啟
    </div>
  </div>
