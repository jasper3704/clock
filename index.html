<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>純淨懸浮時鐘</title>
  <style>
    :root {
      --bg: #0c0d10;
      --card: #16181f;
      --text: #f4f4f6;
      --subtext: #8e93a4;
      --accent: #3b82f6;
      --danger: #ef4444;
      --warn-bg: rgba(245, 158, 11, 0.14);
      --warn-border: rgba(245, 158, 11, 0.4);
      --warn-text: #fcd34d;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: max(env(safe-area-inset-top), 28px) 16px max(env(safe-area-inset-bottom), 32px);
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    /* 收斂容器寬度，避免在手機上撐滿整個螢幕 */
    .container {
      width: 88%;
      max-width: 350px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      text-align: center;
      padding: 4px 0 2px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 4px 0;
      letter-spacing: -0.2px;
    }

    header p {
      font-size: 12.5px;
      color: var(--subtext);
      margin: 0;
    }

    .env-banner {
      display: none;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--warn-text);
      font-size: 13px;
      line-height: 1.5;
    }

    .env-banner strong {
      display: block;
      margin-bottom: 3px;
      font-size: 13.5px;
      color: #fde68a;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .preview-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 600 / 220;
      border-radius: 13px;
      overflow: hidden;
      background: #141418;
      border: 1px solid var(--border);
    }

    #pipVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #clockCanvas {
      display: none;
    }

    .btn-primary {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary.active {
      background: var(--danger);
    }

    .alert-box {
      display: none;
      padding: 11px 12px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      font-size: 12.5px;
      line-height: 1.5;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 2px;
      font-size: 14px;
    }

    .setting-row + .setting-row {
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .switch {
      position: relative;
      width: 46px;
      height: 28px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background-color: #2e3240;
      border-radius: 28px;
      transition: 0.25s;
      cursor: pointer;
    }

    .slider:before {
      content: "";
      position: absolute;
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.25s;
    }

    input:checked + .slider {
      background-color: #22c55e;
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .section-label {
      font-size: 13px;
      color: var(--subtext);
      padding-left: 2px;
      margin-bottom: -4px;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .theme-btn {
      padding: 10px 10px;
      border-radius: 11px;
      border: 1.5px solid var(--border);
      background: #111318;
      color: var(--text);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .theme-btn.selected {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.14);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .tips {
      font-size: 12px;
      color: var(--subtext);
      line-height: 1.6;
      text-align: center;
      padding: 2px 6px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>純淨懸浮時鐘</h1>
      <p>無廣告、免安裝、跨 App 畫中畫懸浮</p>
    </header>

    <!-- 環境偵測提醒框 -->
    <div id="envBanner" class="env-banner"></div>

    <!-- 預覽與啟動區 -->
    <div class="card">
      <div class="preview-wrapper">
        <canvas id="clockCanvas" width="600" height="220"></canvas>
        <video id="pipVideo" playsinline muted autoplay></video>
      </div>

      <button id="toggleBtn" class="btn-primary">啟動懸浮時鐘</button>
      <div id="alertBox" class="alert-box"></div>
    </div>

    <!-- 顯示設定（預設皆為開啟） -->
    <div class="card">
      <div class="setting-row">
        <span>顯示小數點（0.1 秒）</span>
        <label class="switch">
          <input type="checkbox" id="showDeciToggle" checked />
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <span>顯示日期與星期</span>
        <label class="switch">
          <input type="checkbox" id="showDateToggle" checked />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- 配色主題 -->
    <div class="card">
      <div class="section-label">外觀配色</div>
      <div class="theme-grid" id="themeGrid">
        <button class="theme-btn selected" data-theme="pure">
          <span class="dot" style="background:#ffffff;"></span>黑底純白
        </button>
        <button class="theme-btn" data-theme="matrix">
          <span class="dot" style="background:#2ee872;"></span>黑底螢光綠
        </button>
        <button class="theme-btn" data-theme="amber">
          <span class="dot" style="background:#ffa61a;"></span>黑底琥珀橘
        </button>
        <button class="theme-btn" data-theme="light">
          <span class="dot" style="background:#18181b; border:1px solid #666;"></span>白底深黑
        </button>
      </div>
    </div>

    <div class="tips">
      啟動後直接上滑切至其他 App 即可保持懸浮<br>
      建議用 iPhone「捷徑」建立「打開 URL」置於桌面一鍵開啟
    </div>
  </div>

  <script>
    const canvas = document.getElementById('clockCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const pipVideo = document.getElementById('pipVideo');
    const toggleBtn = document.getElementById('toggleBtn');
    const alertBox = document.getElementById('alertBox');
    const envBanner = document.getElementById('envBanner');
    const showDeciToggle = document.getElementById('showDeciToggle');
    const showDateToggle = document.getElementById('showDateToggle');
    const themeBtns = document.querySelectorAll('.theme-btn');

    const THEMES = {
      pure:   { bg: '#141418', fg: '#ffffff', sub: 'rgba(255,255,255,0.72)' },
      matrix: { bg: '#141418', fg: '#2ee872', sub: 'rgba(46,232,114,0.75)' },
      amber:  { bg: '#141418', fg: '#ffa61a', sub: 'rgba(255,166,26,0.75)' },
      light:  { bg: '#f4f4f7', fg: '#16161a', sub: 'rgba(22,22,26,0.68)' }
    };

    const WEEKDAYS = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];

    // 預設開啟小數點與日期
    let state = {
      showDeci: true,
      showDate: true,
      theme: 'pure',
      isPiP: false
    };

    function detectEnvironment() {
      const ua = navigator.userAgent || '';
      const isStandalone = window.navigator.standalone === true ||
                           window.matchMedia('(display-mode: standalone)').matches;
      const isInApp = /Line|FBAN|FBAV|Instagram|Threads|MicroMessenger|Twitter/i.test(ua);

      if (isStandalone) {
        envBanner.innerHTML = '<strong>⚠️ 目前為「主畫面獨立視窗」模式</strong>iOS 系統會封鎖此模式的畫中畫功能。請直接打開 Safari 分頁前往此網址，或改用「捷徑 App」建立桌面啟動圖示。';
        envBanner.style.display = 'block';
      } else if (isInApp) {
        envBanner.innerHTML = '<strong>⚠️ 目前為 App 內建瀏覽器</strong>請點擊畫面右下角（或右上角）的選單圖示，選擇「在 Safari 中開啟」才能啟動懸浮時鐘。';
        envBanner.style.display = 'block';
      }
    }
    detectEnvironment();

    function pad(num) {
      return num < 10 ? '0' + num : '' + num;
    }

    function drawClock() {
      const now = new Date();
      const theme = THEMES[state.theme];
      const w = canvas.width;
      const h = canvas.height;

      ctx.fillStyle = theme.bg;
      ctx.fillRect(0, 0, w, h);

      const hh = pad(now.getHours());
      const mm = pad(now.getMinutes());
      const ss = pad(now.getSeconds());
      let timeStr = `${hh}:${mm}:${ss}`;
      if (state.showDeci) {
        const deci = Math.floor(now.getMilliseconds() / 100);
        timeStr += `.${deci}`;
      }

      // 依是否顯示日期與小數點動態平衡字級與上下位置
      ctx.fillStyle = theme.fg;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const fontSize = state.showDeci ? 82 : 98;
      ctx.font = `700 ${fontSize}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;

      const timeY = state.showDate ? h * 0.63 : h * 0.52;
      ctx.fillText(timeStr, w / 2, timeY);

      if (state.showDate) {
        const yyyy = now.getFullYear();
        const mon = pad(now.getMonth() + 1);
        const day = pad(now.getDate());
        const wk = WEEKDAYS[now.getDay()];
        const dateStr = `${yyyy}/${mon}/${day} ${wk}`;

        ctx.fillStyle = theme.sub;
        ctx.font = `500 25px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif`;
        ctx.fillText(dateStr, w / 2, h * 0.25);
      }
    }

    drawClock();
    const stream = canvas.captureStream(30);
    pipVideo.srcObject = stream;
    pipVideo.play().catch(() => {});

    try {
      const workerBlob = new Blob([`
        setInterval(() => postMessage(1), 50);
      `], { type: 'application/javascript' });
      const worker = new Worker(URL.createObjectURL(workerBlob));
      worker.onmessage = drawClock;
    } catch (e) {
      setInterval(drawClock, 50);
    }

    function showAlert(msg) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    function updatePiPState(active) {
      state.isPiP = active;
      toggleBtn.textContent = active ? '關閉懸浮時鐘' : '啟動懸浮時鐘';
      toggleBtn.classList.toggle('active', active);
    }

    toggleBtn.addEventListener('click', () => {
      hideAlert();

      if (pipVideo.paused) {
        pipVideo.play().catch(() => {});
      }

      if (typeof pipVideo.webkitSupportsPresentationMode === 'function') {
        if (pipVideo.webkitSupportsPresentationMode('picture-in-picture')) {
          const nextMode = pipVideo.webkitPresentationMode === 'picture-in-picture'
            ? 'inline'
            : 'picture-in-picture';
          pipVideo.webkitSetPresentationMode(nextMode);
        } else {
          showAlert('目前視窗被 iOS 系統限制無法啟動畫中畫：請確認你是直接在「Safari 瀏覽器分頁」中開啟此網址，且手機「設定 → 一般 → 子母畫面」已開啟。');
        }
      } else if (document.pictureInPictureEnabled) {
        if (document.pictureInPictureElement) {
          document.exitPictureInPicture().catch(() => {});
        } else {
          pipVideo.requestPictureInPicture().catch(() => {
            showAlert('瀏覽器無法啟動畫中畫，請改用 iPhone Safari 開啟此網址。');
          });
        }
      } else {
        showAlert('目前開啟的瀏覽器不支援畫中畫功能，請改用 iPhone Safari 開啟。');
      }
    });

    pipVideo.addEventListener('webkitpresentationmodechanged', () => {
      updatePiPState(pipVideo.webkitPresentationMode === 'picture-in-picture');
    });

    pipVideo.addEventListener('enterpictureinpicture', () => updatePiPState(true));
    pipVideo.addEventListener('leavepictureinpicture', () => updatePiPState(false));

    showDeciToggle.addEventListener('change', (e) => {
      state.showDeci = e.target.checked;
      drawClock();
    });

    showDateToggle.addEventListener('change', (e) => {
      state.showDate = e.target.checked;
      drawClock();
    });

    themeBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        themeBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        state.theme = btn.dataset.theme;
        drawClock();
      });
    });
  </script>
</body>
</html>
